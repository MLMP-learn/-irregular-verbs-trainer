<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Irregular Verbs Trainer</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6ef;margin:0;color:#26321d}
main{max-width:650px;margin:auto;padding:22px}
h1{text-align:center;color:#55752b}
.card{background:white;padding:22px;border-radius:18px;box-shadow:0 3px 14px #0002;margin:15px 0}
button,select,input{font-size:17px;padding:12px;border-radius:10px;border:1px solid #bbb}
button{background:#668c35;color:white;border:0;font-weight:600;margin:5px}
button.secondary{background:#777}
input{width:calc(100% - 26px);margin:7px 0}
.word{font-size:28px;font-weight:700;text-align:center;margin:20px}
.good{color:#31852d}.bad{color:#c33}
.hidden{display:none}
.progress{text-align:center;color:#667}
</style>
</head>
<body>
<main>
<h1>Irregular Verbs</h1>

<div id="start" class="card">
<h2>Was möchtest du üben?</h2>
<select id="set">
<option value="top">Top 30</option>
<option value="all">Alle Verben</option>
<option value="wrong">Fehler wiederholen</option>
</select>

<h3>Anzahl</h3>
<select id="count">
<option>10</option><option>20</option><option selected>30</option>
<option value="999">Alle</option>
</select>

<h3>Modus</h3>
<select id="mode">
<option value="learn">Lernmodus</option>
<option value="test">Testmodus</option>
</select>
<br><br>
<button onclick="startQuiz()">Start</button>
</div>

<div id="quiz" class="card hidden">
<div id="progress" class="progress"></div>
<div id="german" class="word"></div>

<label>Infinitive</label>
<input id="inf" autocomplete="off" autocapitalize="none">

<label>Simple Past</label>
<input id="past" autocomplete="off" autocapitalize="none">

<div id="feedback"></div>
<br>
<button id="check" onclick="check()">Prüfen</button>
<button id="next" class="hidden" onclick="next()">Weiter</button>
</div>

<div id="result" class="card hidden"></div>
</main>

<script>
const V=[
["sein","be","was/were"],["schlagen; besiegen","beat","beat"],["werden","become","became"],
["beginnen; anfangen","begin","began"],["wetten","bet","bet"],["beißen","bite","bit"],
["(zer)brechen; kaputt machen","break","broke"],["(mit)bringen","bring","brought"],
["bauen","build","built"],["(ver)brennen","burn","burnt/burned"],["kaufen","buy","bought"],
["fangen","catch","caught"],["(aus)wählen","choose","chose"],["kommen","come","came"],
["kosten","cost","cost"],["schneiden","cut","cut"],["sich befassen (mit); umgehen (mit)","deal (with)","dealt (with)"],
["machen; tun","do","did"],["zeichnen; ziehen","draw","drew"],["träumen","dream","dreamt/dreamed"],
["trinken","drink","drank"],["fahren","drive","drove"],["essen","eat","ate"],["(hin)fallen","fall","fell"],
["füttern; ernähren","feed","fed"],["fühlen","feel","felt"],["kämpfen; sich streiten","fight","fought"],
["finden","find","found"],["passen","fit","fit/fitted"],["fliegen","fly","flew"],["vergessen","forget","forgot"],
["vergeben; verzeihen","forgive","forgave"],["gefrieren; erstarren","freeze","froze"],
["bekommen; erhalten","get","got"],["geben","give","gave"],["gehen; fahren","go","went"],
["wachsen; anbauen; züchten","grow","grew"],["hängen","hang","hung"],["haben","have","had"],
["hören","hear","heard"],["(sich) verstecken","hide","hid"],["schlagen; treffen","hit","hit"],
["(fest)halten","hold","held"],["verletzen; sich wehtun","hurt","hurt"],
["(auf)bewahren; behalten","keep","kept"],["kennen; wissen","know","knew"],["(an)führen","lead","led"],
["lernen","learn","learnt/learned"],["(ver)lassen","leave","left"],["lassen","let","let"],
["liegen","lie","lay"],["verlieren","lose","lost"],["machen; tun","make","made"],
["bedeuten; meinen","mean","meant"],["treffen","meet","met"],["(be)zahlen","pay","paid"],
["legen; setzen; stellen","put","put"],["lesen","read","read"],["fahren; reiten","ride","rode"],
["klingeln; läuten","ring","rang"],["laufen; rennen","run","ran"],["sagen","say","said"],
["sehen","see","saw"],["verkaufen","sell","sold"],["senden; verschicken","send","sent"],
["erbauen; errichten","set up","set up"],["schießen","shoot","shot"],["zeigen","show","showed"],
["singen","sing","sang"],["untergehen; sinken","sink","sank"],["sitzen","sit","sat"],
["schlafen","sleep","slept"],["riechen; duften","smell","smelt/smelled"],["sprechen","speak","spoke"],
["buchstabieren","spell","spelt/spelled"],["ausgeben; verbringen","spend","spent"],
["stehen","stand","stood"],["stehlen","steal","stole"],["schwimmen","swim","swam"],
["nehmen","take","took"],["unterrichten; lehren; beibringen","teach","taught"],
["erzählen","tell","told"],["(nach)denken; glauben","think","thought"],["werfen","throw","threw"],
["verstehen","understand","understood"],["(auf)wachen; (auf)wecken","wake up","woke up"],
["anhaben; tragen","wear","wore"],["gewinnen; siegen","win","won"],["schreiben","write","wrote"]
];

const TOP=["be","have","do","say","go","get","make","know","think","take","see","come","give","find",
"tell","become","show","leave","feel","put","bring","begin","keep","hold","write","stand","hear","let","mean","meet"];

let Q=[],pos=0,score=0,errors=[],answers=[];

function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function norm(s){return s.toLowerCase().trim().replace(/\s+/g," ")}
function valid(input,correct){
 return correct.split("/").some(x=>norm(x)==norm(input));
}

function startQuiz(){
 let type=document.getElementById("set").value;
 if(type=="top") Q=V.filter(v=>TOP.includes(v[1]));
 else if(type=="wrong"){
   let saved=JSON.parse(localStorage.getItem("wrongverbs")||"[]");
   Q=V.filter(v=>saved.includes(v[1]));
   if(!Q.length){alert("Noch keine Fehler gespeichert.");return}
 } else Q=[...V];

 Q=shuffle(Q);
 let n=Number(document.getElementById("count").value);
 Q=Q.slice(0,Math.min(n,Q.length));
 pos=score=0;errors=[];answers=[];
 document.getElementById("start").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 show();
}

function show(){
 let v=Q[pos];
 document.getElementById("progress").textContent=(pos+1)+" von "+Q.length;
 document.getElementById("german").textContent=v[0];
 document.getElementById("inf").value="";
 document.getElementById("past").value="";
 document.getElementById("feedback").innerHTML="";
 document.getElementById("check").classList.remove("hidden");
 document.getElementById("next").classList.add("hidden");
 document.getElementById("inf").focus();
}

function check(){
 let v=Q[pos],i=document.getElementById("inf").value,p=document.getElementById("past").value;
 let a=valid(i,v[1]),b=valid(p,v[2]);
 answers.push([v,i,p,a,b]);
 if(a&&b) score++; else errors.push(v);

 if(document.getElementById("mode").value=="learn"){
   document.getElementById("feedback").innerHTML=
   `<p class="${a?'good':'bad'}">Infinitive: ${a?'✓':'✗ '+v[1]}</p>
    <p class="${b?'good':'bad'}">Simple Past: ${b?'✓':'✗ '+v[2]}</p>`;
   document.getElementById("check").classList.add("hidden");
   document.getElementById("next").classList.remove("hidden");
 } else next();
}

function next(){
 pos++;
 if(pos<Q.length) show(); else finish();
}

function finish(){
 document.getElementById("quiz").classList.add("hidden");
 let old=JSON.parse(localStorage.getItem("wrongverbs")||"[]");
 let wrong=[...new Set([...old,...errors.map(v=>v[1])])];
 localStorage.setItem("wrongverbs",JSON.stringify(wrong));

 let r=document.getElementById("result");
 r.classList.remove("hidden");
 r.innerHTML=`<h2>Geschafft! 🎉</h2>
 <h3>${score} von ${Q.length} vollständig richtig</h3>`;

 if(document.getElementById("mode").value=="test"){
   r.innerHTML+="<h3>Auswertung</h3>"+answers.map(x=>
   `<p><b>${x[0][0]}</b><br>
   Infinitive: ${x[3]?'✓':'✗'} ${x[0][1]}<br>
   Simple Past: ${x[4]?'✓':'✗'} ${x[0][2]}</p>`).join("");
 }

 if(errors.length)
   r.innerHTML+=`<p>${errors.length} Verb${errors.length==1?'':'en'} zum Wiederholen gespeichert.</p>`;

 r.innerHTML+=`<button onclick="location.reload()">Neuer Test</button>`;
}
</script>
</body>
</html>
